<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.16</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">characterization of alternating bilinear forms.</span>
</h2>
<div class="para logical">
<div class="para">A bilinear form <span class="process-math">\(\alpha\)</span> on <span class="process-math">\(V\)</span> is alternating if and only if</div>
<div class="displaymath process-math">
\begin{equation*}
\alpha (u,w) = -\alpha (w,u)
\end{equation*}
</div>
<div class="para">for all <span class="process-math">\(u, w \in V{}\text{.}\)</span>
</div>
