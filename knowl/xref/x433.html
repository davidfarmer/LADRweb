<div class="para logical">
<div class="para">A <dfn class="terminology">linear combination</dfn>  of a list <span class="process-math">\(v_1, \dots,
v_m\)</span> of vectors in <span class="process-math">\(V\)</span> is a vector of the form</div>
<div class="displaymath process-math">
\begin{equation*}
a_1 v_1 + \dots + a_m v_m,
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(a_1, \dots, a_m \in \F{}{}\text{.}\)</span>
</div>
