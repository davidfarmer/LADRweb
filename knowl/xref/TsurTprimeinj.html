<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.129</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title"><span class="process-math">\(T\)</span> surjective is equivalent to <span class="process-math">\(T'\)</span> injective.</span>

<div class="para logical">
<div class="para">Suppose <span class="process-math">\(V\)</span> and <span class="process-math">\(W\)</span> are finite-dimensional and <span class="process-math">\(T \in \Lc(V{}, W)\text{.}\)</span> Then</div>
<div class="displaymath process-math">
\begin{equation*}
T \text{ is surjective }  \iff T' \text{ is injective } .
\end{equation*}
</div>
