<div class="para logical">
<div class="para">Suppose <span class="process-math">\(v \in V\)</span> and <span class="process-math">\(U \subset V{}\text{.}\)</span> Then <span class="process-math">\(v + U\)</span> is the subset of <span class="process-math">\(V\)</span> defined by</div>

v + U = \{ v + u: u \in U\}.
\end{equation*}
