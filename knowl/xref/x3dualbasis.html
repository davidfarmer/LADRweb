<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.108</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">dual basis gives coefficients for linear combination.</span>
</h2>
<div class="para logical">
<div class="para">Suppose <span class="process-math">\(v_1, \ldots,
v_n\)</span> is a basis of <span class="process-math">\(V\)</span> and <span class="process-math">\(\phi_1, \ldots, \phi_n\)</span> is the dual basis. Then</div>
<div class="displaymath process-math">
\begin{equation*}
v = \phi_1(v) v_1 + \cdots + \phi_n(v) v_n
\end{equation*}
</div>
<div class="para">for each <span class="process-math">\(v \in V{}\text{.}\)</span>
</div>
