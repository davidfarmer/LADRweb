<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.51</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">dimension of orthogonal complement.</span>

<div class="para logical">
<div class="para">Suppose <span class="process-math">\(V\)</span> is finite-dimensional and <span class="process-math">\(U\)</span> is a subspace of <span class="process-math">\(V{}\text{.}\)</span> Then</div>
<div class="displaymath process-math">

\dim U^\perp = \dim V - \dim U.
\end{equation*}
</div>
