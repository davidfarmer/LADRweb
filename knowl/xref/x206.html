<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.20</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title"><span class="process-math">\(T\)</span> is normal if and only if  <span class="process-math">\(Tv\)</span> and  <span class="process-math">\(T^*v\)</span> have the same norm.</span>
</h2>
<div class="para logical">
<div class="para">Suppose <span class="process-math">\(T \in \Lc(V)\text{.}\)</span> Then</div>
<div class="displaymath process-math">
\begin{equation*}
T \text{ is normal }  \iff \|Tv\| = \|T^*v\| \text{ for every }  v \in V{}.
\end{equation*}
</div>
