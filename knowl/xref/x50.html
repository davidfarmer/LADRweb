<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.42</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Riesz representation theorem.</span>
</h2>
<div class="para logical">
<div class="para"> Suppose <span class="process-math">\(V\)</span> is finite-dimensional and <span class="process-math">\(\phi\)</span> is a linear functional on <span class="process-math">\(V{}\text{.}\)</span> Then there is a unique vector <span class="process-math">\(v \in V\)</span> such that</div>
<div class="displaymath process-math">
\begin{equation*}
\phi(u) = \langle u,v \rangle
\end{equation*}
</div>
<div class="para">for every <span class="process-math">\(u \in V{}\text{.}\)</span>
</div>
