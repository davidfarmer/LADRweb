</h2>
<div class="para logical">
<div class="para">A <dfn class="terminology">bilinear form</dfn> on <span class="process-math">\(V\)</span> is a function <span class="process-math">\(\fun \beta {V{} \times V} \F{}\)</span> such that </div>
<div class="displaymath process-math">
\begin{equation*}
v \mapsto \beta(v, u) \andd v \mapsto \beta(u,v)
\end{equation*}
</div>
<div class="para">are both linear functionals on <span class="process-math">\(V\)</span> for every <span class="process-math">\(u \in V{}\text{.}\)</span>
</div>
