<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.45</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">formula for determinant of a matrix.</span>
</h2>
<div class="para logical">
<div class="para">Suppose that <span class="process-math">\(n\)</span> is a positive integer and <span class="process-math">\(A\)</span> is an <span class="process-math">\(n\)</span>-by-<span class="process-math">\(n\)</span> square matrix. Then</div>
<div class="displaymath process-math">
\begin{equation*}
\det A = \sum_{(j_1, \ldots, j_n) \in \perm n} (  \sign(j_1, \ldots, j_n)  ) A_{j_1,1} \cdots A_{j_n,n}.
\end{equation*}
</div>
