<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">adjoint, <span class="process-math">\(T^\ast\)</span>.</span>
</h2>
<div class="para logical">
<div class="para">Suppose <span class="process-math">\(T \in \Lc(V{}, W)\text{.}\)</span> The <dfn class="terminology">adjoint</dfn>  of <span class="process-math">\(T\)</span> is the function <span class="process-math">\(T^* \colon W \to V\)</span> such that</div>
<div class="displaymath process-math">
\begin{equation*}
\langle Tv, w \rangle  = \langle v, T^*w \rangle
\end{equation*}
</div>
<div class="para">for every <span class="process-math">\(v \in V\)</span> and every <span class="process-math">\(w \in W{}\text{.}\)</span>
</div>
