<div class="para">The <dfn class="terminology">Euclidean inner product</dfn>  on <span class="process-math">\(\F{n}\)</span> is defined by</div>
<div class="displaymath process-math">
\begin{equation*}
\langle (w_1, \dots, w_n), (z_1, \dots, z_n) \rangle  = w_1 \overline{z_1}+ \dots + w_n \overline{z_n}
\end{equation*}
</div>
<div class="para">for all <span class="process-math">\((w_1, \dots, w_n), (z_1, \dots, z_n) \in \FF n\text{.}\)</span>
</div>
