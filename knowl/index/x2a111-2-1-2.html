<div class="para logical">
<div class="para">The <dfn class="terminology">identity operator</dfn>,  denoted by <span class="process-math">\(I\text{,}\)</span> is the  linear map on some vector space that takes each element to itself. To be specific, <span class="process-math">\(I \in \Lc(V)\)</span> is defined by</div>
<div class="displaymath process-math">
\begin{equation*}
Iv = v.
\end{equation*}
</div>
