<div class="para logical">
<div class="para">Suppose <span class="process-math">\(T \in \Lc(V)\text{.}\)</span> The <dfn class="terminology">trace</dfn> of <span class="process-math">\(T\text{,}\)</span> denoted <span class="process-math">\(\tr T\text{,}\)</span> is defined by</div>
<div class="displaymath process-math">

\tr T = \tr \M(  T, (v_1, \ldots, v_n)  ),
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(v_1, \ldots, v_n\)</span> is any basis of <span class="process-math">\(V{}\text{.}\)</span> </div>
