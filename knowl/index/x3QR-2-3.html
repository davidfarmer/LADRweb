<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.44</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">isometry.</span>
</h2>
<div class="para logical">
<div class="para">A linear map <span class="process-math">\(S \in \Lc(V{},W)\)</span> is called an <dfn class="terminology">isometry</dfn>  if</div>
<div class="displaymath process-math">
\begin{equation*}
\| Sv \| = \| v \|
\end{equation*}
</div>
<div class="para">for every <span class="process-math">\(v \in V{}\text{.}\)</span> In other words, a linear map is an isometry if it preserves norms.</div>
