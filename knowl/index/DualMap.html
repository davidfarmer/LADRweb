</h2>
<div class="para logical">
<div class="para"> Suppose <span class="process-math">\(T \in \Lc(V{},W)\text{.}\)</span> The <dfn class="terminology">dual map</dfn> of <span class="process-math">\(T\)</span> is the linear map <span class="process-math">\(T' \in \Lc( W'\!, V' )\)</span> defined for each <span class="process-math">\(\phi \in W'\!\)</span> by</div>
<div class="displaymath process-math">
\begin{equation*}
T' \! (\phi) = \phi \circ T.
\end{equation*}
</div>
