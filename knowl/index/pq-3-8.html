<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.99</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">quotient space, <span class="process-math">\(V/U\)</span>.</span>
</h2>
<div class="para logical">
<div class="para"> Suppose <span class="process-math">\(U\)</span> is a subspace of <span class="process-math">\(V{}\text{.}\)</span> Then the <dfn class="terminology">quotient space</dfn> <span class="process-math">\(V{}/U\)</span> is the set of all translates of <span class="process-math">\(U\text{.}\)</span> Thus </div>
<div class="displaymath process-math">
\begin{equation*}
V{}/U = \{ v + U : v \in V \}.
\end{equation*}
</div>
