<div class="para logical">
<div class="para">For <span class="process-math">\(T \in \Lc(V{}, W)\text{,}\)</span> the <dfn class="terminology">range</dfn> of <span class="process-math">\(T\)</span> is the subset of <span class="process-math">\(W\)</span> consisting of those vectors that are equal to <span class="process-math">\(Tv\)</span> for some <span class="process-math">\(v \in V\text{:}\)</span> </div>
<div class="displaymath process-math">
\begin{equation*}
\ran T = \{Tv: v \in V \}.
\end{equation*}
</div>
