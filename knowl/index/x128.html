<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.42</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">dimension of a sum.</span>
</h2>
<div class="para logical">
<div class="para"> If <span class="process-math">\(V{}_1\)</span> and <span class="process-math">\(V{}_2\)</span> are subspaces of a finite-dimensional vector space, then</div>
<div class="displaymath process-math">
\begin{equation*}
\dim(V{}_1 + V{}_2) = \dim V{}_1 + \dim V{}_2 - \dim(V{}_1 \cap V{}_2).
\end{equation*}
</div>
