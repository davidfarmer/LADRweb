<div class="para">A polynomial <span class="process-math">\(p \in \P(\F{})\)</span> is said to have <dfn class="terminology">degree</dfn>  <span class="process-math">\(m\)</span> if there exist scalars <span class="process-math">\(a_0, a_1, \dots,
a_m \in \F{}\)</span> with <span class="process-math">\(a_m \ne 0\)</span> such that for every <span class="process-math">\(z \in \F{}\text{,}\)</span> we have</div>
<div class="displaymath process-math">
\begin{equation*}
p(z) = a_0 + a_1 z + \dots + a_m z^m\!.
\end{equation*}
</div>
