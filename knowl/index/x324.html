<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.60</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title"><span class="process-math">\(\lvert \det T \rvert   =\)</span> product of singular values of  <span class="process-math">\(T\)</span>.</span>
</h2>
<div class="para logical">
<div class="para">Suppose <span class="process-math">\(V\)</span> is an inner product space and <span class="process-math">\(T \in \Lc(V)\text{.}\)</span> Then </div>
<div class="displaymath process-math">
\begin{equation*}
\lvert \det T \rvert  = \sqrt{\det( T^*T )} = \text{ product of singular values of }  T{}.
\end{equation*}
</div>
