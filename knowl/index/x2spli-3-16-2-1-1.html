<div class="para">A function <span class="process-math">\(p \colon \F{} \to \F{}\)</span>  is called a <dfn class="terminology">polynomial</dfn>  with coefficients in <span class="process-math">\(\F{}\)</span> if there exist <span class="process-math">\(a_0, \dots,
a_m \in \F{}\)</span> such that</div>
<div class="displaymath process-math">
\begin{equation*}
p(z) = a_0 + a_1 z + a_2 z^2 + \dots + a_m z^m
\end{equation*}
</div>
<div class="para">for all <span class="process-math">\(z \in \F{}{}\text{.}\)</span>
</div>
