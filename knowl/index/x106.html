<dfn class="terminology">Addition</dfn> in <span class="process-math">\(\F{n}\)</span> is defined by adding corresponding coordinates:</div>
<div class="displaymath process-math">
\begin{equation*}
(x_1, \dots, x_n) + (y_1, \dots, y_n) = (x_1 + y_1, \dots, x_n + y_n).
\end{equation*}
</div>
