<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.8</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">division algorithm for polynomials.</span>

<div class="para logical">
<div class="para"> Suppose that <span class="process-math">\(p, s \in \P(\F{})\text{,}\)</span> with <span class="process-math">\(s \ne 0\text{.}\)</span> Then there exist unique polynomials <span class="process-math">\(q,

p = sq + r
\end{equation*}

</div>
