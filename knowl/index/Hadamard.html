<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.66</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Hadamard’s inequality.</span>
</h2>
<div class="para logical">
<div class="para">Suppose <span class="process-math">\(A\)</span> is an <span class="process-math">\(n\)</span>-by-<span class="process-math">\(n\)</span> matrix. Let <span class="process-math">\(v_1, \ldots, v_n\)</span> denote the columns of <span class="process-math">\(A\text{.}\)</span> Then </div>
<div class="displaymath process-math">
\begin{equation*}
\lvert  \det A  \rvert  \le \prod_{k=1}^n   \lVert  v_k  \rVert .
\end{equation*}
</div>
